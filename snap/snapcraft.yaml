name: notbad
base: core22
version: '1.1.2'
summary: Distraction-free, cross-platform Markdown writer
description: |
  NotBad is a lightweight, distraction-free Markdown editor designed for writers.
  Features include concealed markup mode, monospace table formatting,
  built-in Indian language typing support (Telugu Anu Script layout & phonetic transliteration),
  daily word count goals, focus mode, and multi-theme support.

grade: stable
confinement: strict

architectures:
  - build-on: amd64

apps:
  notbad:
    command: notbad_flutter
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - network

parts:
  notbad:
    source: notbad-flutter
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - libgtk-3-dev
      - ninja-build
      - pkg-config
