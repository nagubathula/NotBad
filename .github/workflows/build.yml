name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: notbad-flutter

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: notbad-flutter/build/windows/x64/runner/Release
          - os: ubuntu-latest
            target: linux
            artifact: notbad-flutter/build/linux/x64/release/bundle
          - os: macos-latest
            target: macos
            artifact: notbad-flutter/build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: notbad-${{ matrix.target }}
          path: ${{ matrix.artifact }}
