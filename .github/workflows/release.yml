name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: notbad-flutter
      - run: flutter test
        working-directory: notbad-flutter
      - run: flutter build windows --release
        working-directory: notbad-flutter
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path notbad-flutter/build/windows/x64/runner/Release/* `
            -DestinationPath NotBad-windows-x64.zip
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" notbad-flutter\installer\notbad.iss
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            NotBad-windows-x64.zip
            notbad-flutter/installer/Output/NotBad-Setup-*.exe
          generate_release_notes: true
